[package]
name = "swiftsim"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"

description = "Fast, open-source SPICE circuit simulator with a modern schematic editor and waveform viewer"
license = "MIT OR Apache-2.0"

[profile.release]
lto = "thin"

[dependencies]
eframe = { version = "0.37.0", features = ["persistence"] }
egui_plot = "0.38.0"
egui_system_font_provider = "0.37"
flate2 = "1"
icu_normalizer = "2"
rfd = "0.17.2"
# already built for ureq's TLS; SHA-256 of downloaded updates
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sys-locale = "0.3.2"
unicode-bidi = "0.3"
unicode-segmentation = "1"
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"
